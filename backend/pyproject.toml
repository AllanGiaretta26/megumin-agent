[project]
name = "backend"
version = "0.1.0"
description = "Agent AI Megumin — backend FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv",
    "ollama",
    "httpx",
    "langgraph",
    "langchain",
    "langchain-ollama",
    "langchain-openai",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
